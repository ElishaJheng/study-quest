<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計劃排一排 Study Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#29366f">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="計劃排一排">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --k:#1a1c2c; --p:#5d275d; --r:#b13e53; --o:#ef7d57; --y:#ffcd75; --l:#a7f070; --g:#38b764; --t:#257179;
  --n:#29366f; --b:#3b5dc9; --c:#41a6f6; --a:#73eff7; --w:#f4f4f4; --s:#94b0c2; --d:#566c86; --e:#333c57;
  --edge: 0 -4px 0 0 var(--k), 0 4px 0 0 var(--k), -4px 0 0 0 var(--k), 4px 0 0 0 var(--k);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:'DotGothic16', 'PingFang TC','Microsoft JhengHei', system-ui, sans-serif;
  color:var(--k); font-size:17px; line-height:1.45;
  background:linear-gradient(180deg,
    var(--n) 0 8%, var(--b) 8% 22%, var(--c) 22% 45%, var(--a) 45% 70%, #b8f6fa 70% 100%) fixed;
  min-height:100vh; -webkit-font-smoothing:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.n{font-family:'Press Start 2P', monospace; font-size:.72em; letter-spacing:0}
.spr{display:block;image-rendering:pixelated}
h2{font-size:21px;margin:0}
small{font-size:14px}

/* ---- clouds ---- */
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;width:8px;height:8px;background:var(--w);opacity:.85;
  box-shadow:8px 0 var(--w),16px 0 var(--w),24px 0 var(--w),8px -8px var(--w),16px -8px var(--w),
  -8px 8px var(--w),0 8px var(--w),8px 8px var(--w),16px 8px var(--w),24px 8px var(--w),32px 8px var(--w);
  animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(110vw)}}

/* ---- layout ---- */
#app{position:relative;z-index:1}
#main{max-width:880px;margin:0 auto;padding:18px 14px 120px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  background:var(--k);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:4px solid var(--y)}
.navb{flex:1;background:none;border:none;color:var(--w);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;cursor:pointer;font-size:14px;touch-action:manipulation}
.navb .spr{width:26px;height:26px}
.navb.on{background:var(--y);color:var(--k)}
.navb:active{transform:translateY(2px)}
.navlogo{display:none}
@media (min-width:860px){
  #app{display:grid;grid-template-columns:190px 1fr}
  #nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;
    border-top:none;border-right:4px solid var(--y);padding:16px 10px}
  .navb{flex:none;flex-direction:row;gap:10px;padding:10px 12px;font-size:17px;justify-content:flex-start}
  .navlogo{display:block;color:var(--y);text-align:center;margin:4px 0 18px;font-size:13px;line-height:1.8}
  #main{padding:28px 24px 40px}
}

/* ---- pixel panels & buttons ---- */
.px{box-shadow:var(--edge), 0 10px 0 0 rgba(26,28,44,.35);margin:4px 4px 22px}
.panel{background:var(--w);padding:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--d);font-size:15px;margin:2px 0 8px}
.btn{border:none;cursor:pointer;background:var(--bg,var(--y));color:var(--fg,var(--k));min-height:44px;padding:8px 16px;margin:6px 4px;
  box-shadow:var(--edge), inset -4px -4px 0 0 rgba(0,0,0,.22), inset 4px 4px 0 0 rgba(255,255,255,.45);
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(3px);box-shadow:var(--edge), inset 4px 4px 0 0 rgba(0,0,0,.25)}
.btn.sm{min-height:40px;padding:4px 10px;font-size:15px}
.btn.wide{display:block;width:calc(100% - 8px);margin-top:14px}
.btn.green{--bg:var(--g);--fg:var(--w)}
.btn.blue{--bg:var(--b);--fg:var(--w)}
.btn.red{--bg:var(--r);--fg:var(--w)}
.btn.gray{--bg:var(--s)}
.btn.white{--bg:var(--w)}
.btn.on{--bg:var(--l)}
.btn[disabled]{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0 8px}
.lbl{font-size:15px;color:var(--d);margin-top:10px}
input[type=text],input[type=number],textarea{width:100%;background:#fff;border:none;padding:10px;margin:6px 0;
  box-shadow:var(--edge), inset 3px 3px 0 0 var(--s);outline:none;border-radius:0}
input:focus,textarea:focus{box-shadow:var(--edge), inset 3px 3px 0 0 var(--c)}
input[type=range]{width:100%;accent-color:var(--r);height:30px}

/* ---- HUD ---- */
.hud{display:flex;gap:16px;align-items:center;background:var(--n);color:var(--w)}
.hero{background:var(--b);padding:8px;box-shadow:var(--edge)}
.hero .spr{width:84px;height:98px}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hudinfo{flex:1;min-width:0}
.pname{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv{background:var(--y);color:var(--k);padding:4px 6px}
.bar{height:20px;background:var(--e);box-shadow:var(--edge);margin:10px 4px 4px;position:relative}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--l) 0 12px,var(--g) 12px 15px);transition:width .4s steps(8)}
.bar.mini{height:12px;margin:6px 4px 12px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;align-items:center}
.stat{display:flex;align-items:center;gap:6px}
.stat .spr{width:22px;height:22px}

/* ---- tasks ---- */
.tasks{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.task{display:flex;align-items:center;gap:10px;background:#fff;padding:8px;box-shadow:var(--edge);margin:4px}
.sb{width:42px;height:42px;flex:none;display:grid;place-items:center;color:#fff;font-size:22px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3), inset 3px 3px 0 rgba(255,255,255,.3)}
.tt{flex:1;min-width:0}
.tt b{display:block;font-weight:normal;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{color:var(--d)}
.check{width:46px;font-size:22px;--bg:var(--w)}
.task.done{background:#e6f7d9}
.task.done .tt b{text-decoration:line-through;color:var(--d)}
.task.done .check{--bg:var(--g);--fg:var(--w)}
.empty{text-align:center;color:var(--d);padding:14px 0}
.clear{margin-top:14px;text-align:center;background:var(--y);padding:10px;box-shadow:var(--edge);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--o);color:var(--w)}}
.msg{background:#fff4d6;cursor:pointer}
.msg p{font-size:20px;margin:6px 0}
.goal{display:flex;align-items:center;gap:10px;padding:6px 0}
.goal.done span{text-decoration:line-through;color:var(--d)}

/* ---- plan ---- */
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs .btn{flex:1}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.dnav .t{text-align:center;flex:1;font-size:19px}
.week{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.wday{background:#fff;box-shadow:var(--edge);margin:4px;padding:6px;min-height:80px;display:flex;flex-direction:column}
.wday.today{background:#fff4d6}
.wday h4{margin:0 0 4px;font-weight:normal;font-size:15px;display:flex;justify-content:space-between;cursor:pointer}
.wchip{font-size:13px;color:#fff;padding:2px 4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip.done{opacity:.5;text-decoration:line-through}
.wadd{margin-top:auto;background:none;border:2px dashed var(--s);color:var(--d);cursor:pointer;padding:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal .hd{text-align:center;color:var(--d);font-size:14px}
.cell{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:100%;min-width:0;height:clamp(40px,11vw,64px);margin:0;
  background:#fff;border:3px solid var(--k);border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:inherit;font-size:13px;line-height:1.2;color:var(--k);cursor:pointer;padding:0;overflow:hidden}
.cell small{font-size:11px}
.cell.all{background:var(--g);color:#fff}
.cell.part{background:var(--y)}
.cell.miss{background:var(--r);color:#fff}
.cell.todo{background:var(--a)}
.cell.today{outline:3px dashed var(--r);outline-offset:-7px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;margin-right:4px;vertical-align:-2px;box-shadow:0 0 0 2px var(--k)}

/* ---- focus ---- */
.focus{text-align:center}
.ftime{font-family:'Press Start 2P',monospace;font-size:clamp(40px,12vw,72px);margin:16px 0;color:var(--k);
  text-shadow:4px 4px 0 var(--y)}
.blocks{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin:12px 4px}
.blocks i{height:22px;background:var(--e)}
.blocks i.f{background:var(--l);box-shadow:inset -3px -3px 0 var(--g)}
.fhero{display:flex;justify-content:center;margin:8px}
.fhero .spr{width:96px;height:112px}

/* ---- rewards ---- */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.item{background:#fff;box-shadow:var(--edge);margin:4px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.item .spr{width:56px;height:40px}
.price{display:flex;align-items:center;gap:4px}
.price .spr{width:18px;height:18px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.badge{text-align:center;padding:8px 4px;background:#fff;box-shadow:var(--edge);margin:4px;cursor:pointer}
.badge .spr{width:48px;height:58px;margin:0 auto 4px}
.badge.lock .spr{filter:grayscale(1) brightness(.6);opacity:.5}
.badge.lock{color:var(--s)}
.badge b{display:block;font-weight:normal;font-size:15px}
.hist{font-size:15px}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:2px dashed var(--s)}
.tag{padding:0 6px;font-size:13px}
.tag.wait{background:var(--y)} .tag.ok{background:var(--g);color:#fff} .tag.no{background:var(--s)}

/* ---- settings ---- */
.quote{font-size:14px;color:var(--y);margin-top:2px}
.av.off .avimg{filter:grayscale(.8);opacity:.6}
.big4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
@media (min-width:640px){.big4{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.big4 .spr{width:84px;height:98px}
.big4 .av{font-size:18px;padding:14px 4px}
.say{background:#fff4d6;margin:18px 4px 6px;padding:12px;font-size:20px;animation:pop .18s steps(3)}
body.picking #nav{display:none}
body.picking #main{padding-bottom:30px}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:8px}
.av{background:#fff;border:none;cursor:pointer;box-shadow:var(--edge);margin:4px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:manipulation}
.av .avimg{background:var(--b);padding:6px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.av .spr{width:52px;height:60px}
.av.on{background:var(--y);box-shadow:var(--edge),0 0 0 8px var(--r)}
.av.on .spr{animation:bob 1s steps(2) infinite}
.av:active{transform:translateY(3px)}
.av small{font-size:12px;color:var(--r)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed var(--s)}
.row:last-child{border-bottom:none}

/* ---- parent ---- */
.pbar{display:flex;align-items:center;justify-content:space-between;background:var(--p);color:var(--w)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:#fff;box-shadow:var(--edge);margin:4px;padding:10px;text-align:center}
.kpi .v{font-family:'Press Start 2P',monospace;font-size:20px;margin:6px 0;color:var(--b)}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0}
.hbar .nm{width:44px;flex:none}
.hbar .tr{flex:1;height:18px;background:#e3e8ee}
.hbar .tr i{display:block;height:100%}
.hbar .val{width:70px;text-align:right;font-size:14px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0;border-bottom:4px solid var(--k)}
.vb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.vb .pl{width:100%;background:#d4dbe3;position:relative}
.vb .dn{position:absolute;left:0;right:0;bottom:0;background:var(--g)}
.vlab{display:flex;gap:8px;padding:4px}
.vlab span{flex:1;text-align:center;font-size:13px}
.req{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:2px dashed var(--s)}

/* ---- modal, toast, start ---- */
#modal .ov{position:fixed;inset:0;background:rgba(26,28,44,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.mbox{width:100%;max-width:440px;animation:pop .18s steps(3)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.mbox h3{margin:0 0 8px;font-size:22px}
.mact{display:flex;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.big{text-align:center}
.big .spr{margin:8px auto}
.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin{display:flex;justify-content:center;gap:12px;margin:10px 0 14px}
.pin i{width:36px;height:42px;background:#fff;box-shadow:var(--edge);display:grid;place-items:center;font-style:normal;font-size:24px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.float{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;pointer-events:none;font-family:'Press Start 2P',monospace;
  font-size:16px;color:var(--y);text-shadow:3px 3px 0 var(--k),-2px -2px 0 var(--k),2px -2px 0 var(--k),-2px 2px 0 var(--k);
  animation:floatup 1.4s steps(14) forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-70px);opacity:0}}
.conf{position:fixed;top:-12px;width:10px;height:10px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#start{position:fixed;inset:0;z-index:100;background:var(--k);color:var(--w);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;cursor:pointer;text-align:center;padding:20px;
  background-image:radial-gradient(var(--d) 1px,transparent 1.5px);background-size:28px 28px}
#start .t1{font-family:'Press Start 2P',monospace;font-size:clamp(22px,6vw,44px);color:var(--y);
  text-shadow:4px 4px 0 var(--r),8px 8px 0 var(--p);line-height:1.4}
#start .t2{font-size:clamp(24px,6vw,36px);color:var(--a)}
#start .go{font-size:22px;animation:blink2 1s steps(2) infinite}
@keyframes blink2{50%{opacity:0}}
#start .spr{width:110px;height:128px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="clouds" aria-hidden="true">
  <div class="cloud" style="top:12%;animation-duration:70s;animation-delay:-20s"></div>
  <div class="cloud" style="top:28%;animation-duration:95s;animation-delay:-60s"></div>
  <div class="cloud" style="top:50%;animation-duration:80s;animation-delay:-5s"></div>
</div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div>
<div id="start" data-act="startGame" data-sfx="none">
  <div id="startHero"></div>
  <div class="t1">STUDY<br>QUEST</div>
  <div class="t2">計劃排一排</div>
  <div class="go">▶ 點一下開始</div>
  <small style="color:var(--s)">哇~完成會有獎勵喔！</small>
</div>

<script>
(function(){
'use strict';
/* =================== helpers =================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const WD=['日','一','二','三','四','五','六'];
const weekStart=s=>{const d=parse(s);return addDays(s,-((d.getDay()+6)%7))};
const fmtDate=s=>{const d=parse(s);return `${d.getMonth()+1}月${d.getDate()}日 星期${WD[d.getDay()]}`};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =================== pixel sprites =================== */
const PAL={k:'#1a1c2c',w:'#f4f4f4',y:'#ffcd75',o:'#ef7d57',r:'#b13e53',p:'#5d275d',g:'#38b764',l:'#a7f070',
  b:'#3b5dc9',c:'#41a6f6',a:'#73eff7',n:'#29366f',s:'#94b0c2',d:'#566c86',e:'#333c57',t:'#257179',f:'#ffd2a8'};
function spr(rows,sub){
  sub=sub||{};const h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>{let x=0;while(x<w){const ch=row[x];if(ch==='.'){x++;continue}let x2=x;while(x2<w&&row[x2]===ch)x2++;
    r+=`<rect x="${x}" y="${y}" width="${x2-x}" height="1" fill="${sub[ch]||PAL[ch]}"/>`;x=x2}});
  return `<svg class="spr" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const AVATARS=[
  {id:'ninja',name:'塗鴉忍者',say:'一筆畫完今天的功課！',sfx:'h_ninja',sub:{},rows:["...kkkkkk...","..knnnnnnk..",".knnnnnnnnk.",".krrrrrrrrkr",".knnnnnnnnk.",".kffffffffk.",".kfkffffkfk.",
    ".knnnnnnnnk.","..knnnnnnk.l","...kkkkkk.yo","..knnnnnnkdk",".kfknnnnkfk.",".kkknnnnkkk.","...knk.knk.."]},
  {id:'space',name:'太空小隊長',say:'3、2、1，讀書任務發射！',sfx:'h_space',sub:{},rows:["...kkkkkk...","..kwwwwwwk..",".kwwwwwwwwk.",".kwkkkkkkwk.",".kwkfkkfkwk.",".kwkffffkwk.",".kwkfoofkwk.",
    ".kwkkkkkkwk.","..kwwrrwwk..",".skwwwwwwks.",".skwwrrwwks.",".skwwwwwwks.",".yokwk.kwkoy","..o.kk.kk.o."]},
  {id:'dino',name:'拳擊恐龍寶寶',say:'吼！一拳打倒難題！',sfx:'h_dino',sub:{},rows:["....kkkk....","...kggggk...","..kggggggkk.","..kgkggggggk","..kggggggggk","..kgggwkwkk.","...kgggggk..",
    "krrkglllgkrr","krrkglllgkrr",".kkkglllgkk.","...kgggggkgk","...kgggggggk","...kgk.kgkk.","...kkk.kkk.."]},
  {id:'hamster',name:'電光倉鼠',say:'充電完成，閃電出擊！',sfx:'h_hamster',sub:{h:'#ef7d57'},rows:[".kk......kk.","khhk....khhk","khhkkkkkkhhk",".khhhhhhhhk.","khhkhhhhkhhk","khhhhkkhhhhk","krrhhhhhhrrk",
    ".khhhwwhhhk.","..kkkkkkkk..",".khwwwyywhk.","khhwwyywwhhk",".khwyywwwhk.","..khhkkhhk..","..kkk..kkk.."]},

const AU={ctx:null,music:null,sfx:null,noise:null,cur:null,step:0,next:0,iv:null};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AU.ctx=new C()}catch(e){return}
  AU.music=AU.ctx.createGain();AU.sfx=AU.ctx.createGain();
  AU.music.connect(AU.ctx.destination);AU.sfx.connect(AU.ctx.destination);
  const len=AU.ctx.sampleRate*.2,buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;AU.noise=buf;
  applyVol();
}
function applyVol(){if(!AU.ctx)return;AU.music.gain.value=S.settings.musicOn?S.settings.music*.6:0;AU.sfx.gain.value=S.settings.sfxOn?S.settings.sfx*.8:0}
function nf(n){const m=/^([A-G])(#?)(\d)$/.exec(n);const i={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,((+m[3]+1)*12+i-69)/12)}
function tone(f,t,dur,type,vol,dest,f2){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
}
function hat(t,vol,dest){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+.06)}

    case 'h_hamster':for(let i=0;i<8;i++)tone(i%2?1800:900,t+i*.035,.04,q,.08,d);seq(['E6','A6','E7'],.06,q,.1);break;
    case 'lock':seq(['C5','G5','C6','E6','G6','C7'],.07,q,.11);seq(['C4','G4','C5'],.14,'triangle',.18);break;

const TR={
  main:{bpm:132,lt:'square',lv:.06,bv:.13,hat:true,ld:.12,
    lead:['E5','-','G5','-','C6','-','G5','E5', 'A5','-','E5','-','C5','-','E5','-', 'F5','-','A5','-','C6','-','A5','-', 'G5','-','B5','-','D6','C6','B5','G5',
          'C6','-','B5','C6','G5','-','E5','-', 'A5','-','G5','A5','E5','-','C5','-', 'F5','G5','A5','C6','A5','-','F5','-', 'G5','A5','B5','D6','C6','-','-','-'],
    bass:'C3 C4 A2 A3 F2 F3 G2 G3 C3 C4 A2 A3 F2 F3 G2 G3'.split(' ')},
  focus:{bpm:72,lt:'triangle',lv:.09,bv:.12,hat:false,ld:.5,

    bass:'C3 - A2 - F2 - G2 -'.split(' ')}
};
function sched(){
  if(!AU.ctx||!AU.cur)return;const tr=TR[AU.cur],st=60/tr.bpm/2;
  while(AU.next<AU.ctx.currentTime+.15){
    const i=AU.step,t=AU.next,L=tr.lead[i%tr.lead.length];
    if(L&&L!=='-')tone(nf(L),t,tr.ld,tr.lt,tr.lv,AU.music);
    if(i%4===0||tr.hat){const bi=Math.floor(i/4)%tr.bass.length,B=tr.bass[bi];
      if(i%4===0&&B&&B!=='-')tone(nf(B),t,st*3.5,'triangle',tr.bv,AU.music);
      else if(tr.hat&&i%4===2&&B&&B!=='-')tone(nf(B)*2,t,st*1.5,'triangle',tr.bv*.7,AU.music);}
    if(tr.hat&&i%2===1)hat(t,.05,AU.music);
    AU.next+=st;AU.step=(AU.step+1)%tr.lead.length;
  }
}
function playMusic(name){
  if(!AU.ctx)return;
  if(!S.settings.musicOn){stopMusic();return}
  if(AU.cur===name&&AU.iv)return;
  AU.cur=name;AU.step=0;AU.next=AU.ctx.currentTime+.08;
  if(!AU.iv)AU.iv=setInterval(sched,25);
}

  <div class="lbl">要做什麼？</div><input type="text" id="nfT" maxlength="20" placeholder="${s.tip[0]}" value="${esc(NF.title)}">
  <div class="chips">${s.tip.map(t=>`<button class="btn sm white" data-act="nfTip" data-t="${t}">${t}</button>`).join('')}</div>
  <div class="lbl">預計時間</div><div class="chips">${[10,15,20,25,30,45,60].map(m=>`<button class="btn sm ${NF.minutes===m?'on':'white'}" data-act="nfM" data-m="${m}">${m}分</button>`).join('')}</div>
  <div class="mact"><button class="btn gray" data-act="close" data-sfx="back">取消</button><button class="btn green" data-act="nfOK" data-sfx="pop">新增！</button></div>`}

/* =================== actions =================== */
const A={
  startGame(){audioInit();$('#start').remove();SFX.play('start');render()},
  go(el){if(el.dataset.tab)planTab=el.dataset.tab;go(el.dataset.v)},
  close(){closeModal()},
  toggle(el){const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;
    if(!t.done)completeTask(t.id);
    else{SFX.play('click');modal(`<h3>要取消完成嗎？</h3><p>「${esc(t.title)}」會變回未完成，並扣回 20 EXP、10 金幣。</p><div class="mact"><button class="btn gray" data-act="close" data-sfx="back">不要</button><button class="btn red" data-act="undo" data-id="${t.id}">取消完成</button></div>`)}},
  undo(el){closeModal();uncompleteTask(el.dataset.id)},
  delTask(el){S.tasks=S.tasks.filter(t=>t.id!==el.dataset.id);save();render()},
  addTask(el){addTaskModal(el.dataset.date)},
  nfS(el){NF.subject=el.dataset.id;drawAdd()},
  nfTip(el){NF.title=el.dataset.t;drawAdd()},
  nfM(el){NF.minutes=+el.dataset.m;drawAdd()},
  nfOK(){const s=subj(NF.subject);S.tasks.push({id:uid(),date:NF.date,subject:NF.subject,title:(NF.title||'').trim()||s.tip[0],minutes:NF.minutes,done:false});
    closeModal();floatText('任務新增！');checkBadges();save();render()},
  copyNext(el){const d=el.dataset.date,n=addDays(d,1);tasksOn(d).forEach(t=>S.tasks.push({id:uid(),date:n,subject:t.subject,title:t.title,minutes:t.minutes,done:false}));
    planDate=n;floatText('已複製到隔天');checkBadges();save();render()},
  tab(el){planTab=el.dataset.tab;render()},
  pd(el){planDate=addDays(planDate,+el.dataset.n);render()},
  pdToday(){planDate=today();render()},
  pm(el){const d=parse(planDate);d.setDate(1);d.setMonth(d.getMonth()+(+el.dataset.n));planDate=ymd(d);render()},
  openDay(el){planDate=el.dataset.date;planTab='day';go('plan')},
  goalAdd(el){const v=($('#goalIn').value||'').trim();if(!v){SFX.play('error');return}S.monthGoals.push({id:uid(),month:el.dataset.m,title:v,done:false});save();render()},
  goalDel(el){S.monthGoals=S.monthGoals.filter(g=>g.id!==el.dataset.id);save();render()},
  goalT(el){const g=S.monthGoals.find(x=>x.id===el.dataset.id);if(!g)return;g.done=!g.done;
    if(g.done){SFX.play('level');confetti();gain(50,30);checkBadges()}else{SFX.play('back');S.player.xp=Math.max(0,S.player.xp-50);S.player.coins=Math.max(0,S.player.coins-30)}save();render()},
  readMsg(el){const m=S.messages.find(x=>x.id===el.dataset.id);if(m)m.read=true;SFX.play('pop');save();render()},
  focusTask(el){F.taskId=el.dataset.id;const t=S.tasks.find(x=>x.id===F.taskId);if(t)F.min=[10,15,25,40].includes(t.minutes)?t.minutes:Math.min(40,t.minutes);go('focus')},
  fTask(el){F.taskId=el.dataset.id||null;render()},
  fMin(el){F.min=+el.dataset.m;render()},
  fStart(){SFX.play('start');F.total=F.min*60;F.left=F.total;F.endAt=Date.now()+F.total*1000;F.running=true;F.paused=false;F.lastBeep=-1;
    clearInterval(F.iv);F.iv=setInterval(focusTick,250);render()},
  fPause(){if(F.paused){F.endAt=Date.now()+F.left*1000;F.paused=false}else{F.left=Math.max(0,Math.ceil((F.endAt-Date.now())/1000));F.paused=true}render()},
  fQuit(){modal(`<h3>要放棄這次專注嗎？</h3><p>放棄的話這次不會得到獎勵喔。</p><div class="mact"><button class="btn green" data-act="close">繼續加油</button><button class="btn gray" data-act="fQuitOK" data-sfx="back">放棄</button></div>`)},
  fQuitOK(){clearInterval(F.iv);F.running=false;F.paused=false;closeModal();render()},
  focusDoneTask(el){closeModal();completeTask(el.dataset.id)},
  redeem(el){const r=S.rewards.find(x=>x.id===el.dataset.id);if(!r)return;
    if(S.player.coins<r.cost){SFX.play('error');floatText(`還差 ${r.cost-S.player.coins} 金幣`);return}
    SFX.play('click');modal(`<div class="big"><h3>確定兌換？</h3><div style="width:80px;margin:0 auto">${CHEST}</div><p>${esc(r.name)}<br>需要 <b class="n">${r.cost}</b> 金幣</p></div>
      <div class="mact"><button class="btn gray" data-act="close" data-sfx="back">再想想</button><button class="btn green" data-act="redeemOK" data-id="${r.id}" data-sfx="coin">兌換！</button></div>`)},
  redeemOK(el){const r=S.rewards.find(x=>x.id===el.dataset.id);closeModal();if(!r||S.player.coins<r.cost)return;
    S.player.coins-=r.cost;S.redeems.push({id:uid(),name:r.name,cost:r.cost,status:'wait',date:today()});confetti();floatText('已送出！等爸媽確認');save();render()},
  badgeInfo(el){const b=BADGES.find(x=>x.id===el.dataset.id);const got=S.badges[b.id];
    modal(`<div class="big"><div style="width:80px;margin:0 auto;${got?'':'filter:grayscale(1);opacity:.5'}">${MEDAL(b.c)}</div><h3>${got?b.name:'？？？'}</h3><p>${b.desc}</p>${got?`<small>${got} 獲得</small>`:'<small>還沒獲得，加油！</small>'}</div><div class="mact"><button class="btn" data-act="close">OK</button></div>`)},
  pickHero(el){pickSel=el.dataset.id;SFX.play(avOf(pickSel).sfx);render()},
  pickOK(){const a=avOf(pickSel);if(!a)return;SFX.play('click');
    modal(`<div class="big"><h3>確定選擇「${a.name}」？</h3><div class="hero" style="display:inline-block">${hero(1,a.id)}</div>
      <p style="color:var(--r)"><b>⚠ 英雄一旦鎖定，就不能再更換囉！</b></p></div>
      <div class="mact"><button class="btn gray" data-act="close" data-sfx="back">再想想</button><button class="btn red" data-act="pickLock" data-sfx="none">🔒 確定鎖定</button></div>`)},
  pickLock(){const a=avOf(pickSel);if(!a)return;S.player.avatar=a.id;S.player.avatarLocked=true;save();closeModal();SFX.play('lock');confetti();
    floatText(a.say);view='home';render();window.scrollTo(0,0)},
  avLocked(el){SFX.play(el.dataset.id===S.player.avatar?avOf(el.dataset.id).sfx:'error');
    if(el.dataset.id!==S.player.avatar)modal(`<div class="big"><h3>🔒 英雄已鎖定</h3><div class="hero" style="display:inline-block">${hero(lvOf(S.player.xp))}</div>
      <p>你已經選了「${avOf(S.player.avatar).name}」當你的英雄，<br>不能再更換囉！一起陪他升級吧！</p></div><div class="mact"><button class="btn green" data-act="close">好的！</button></div>`)},
  heroReset(){modal(`<h3>讓孩子重新選英雄？</h3><p>孩子下次打開時，會回到「選擇你的英雄」畫面重新挑選（等級、金幣不受影響）。</p><div class="mact"><button class="btn gray" data-act="close" data-sfx="back">取消</button><button class="btn red" data-act="heroResetOK">確定</button></div>`)},
  heroResetOK(){S.player.avatar=null;S.player.avatarLocked=false;pickSel=null;save();closeModal();floatText('已解除鎖定');render()},
  install(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.then(r=>{deferredInstall=null;if(r&&r.outcome==='accepted'){confetti();floatText('已加入主畫面！')}render()}).catch(()=>{})},
  tgl(el){const k=el.dataset.k;S.settings[k]=!S.settings[k];applyVol();save();if(k==='musicOn'&&!S.settings.musicOn)stopMusic();render()},
  test(el){SFX.play(el.dataset.s)},
  saveName(){const v=($('#nameIn').value||'').trim();if(!v){SFX.play('error');return}S.player.name=v;save();floatText('已儲存');render()},
  openParent(){pinBuf='';modal('','');drawPin()},
  pk(el){const k=el.dataset.k;if(k==='c')pinBuf='';else if(pinBuf.length<4)pinBuf+=k;drawPin();
    if(pinBuf.length===4){if(pinBuf===S.pin){parentOK=true;closeModal();SFX.play('done');view='parent';render();window.scrollTo(0,0)}
      else{SFX.play('error');pinBuf='';const b=mbox();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');setTimeout(drawPin,300)}}},
  rv(el){const r=S.redeems.find(x=>x.id===el.dataset.id);if(!r)return;if(el.dataset.ok==='1'){r.status='ok';confetti()}else{r.status='no';S.player.coins+=r.cost}save();render()},
  rwDel(el){S.rewards=S.rewards.filter(r=>r.id!==el.dataset.id);save();render()},
  rwAdd(){const n=($('#rwName').value||'').trim(),c=parseInt($('#rwCost').value,10);if(!n||!(c>0)){SFX.play('error');return}S.rewards.push({id:uid(),name:n,cost:c});save();render()},
  quickMsg(el){$('#msgIn').value=el.dataset.t},
  sendMsg(){const v=($('#msgIn').value||'').trim();if(!v){SFX.play('error');return}S.messages.push({id:uid(),text:v,date:today(),read:false});save();floatText('留言已送出');render()},
  pinSave(){const v=($('#pinIn').value||'').trim();if(!/^\d{4}$/.test(v)){SFX.play('error');floatText('請輸入 4 位數字');return}S.pin=v;save();floatText('密碼已更新');render()},
  resetAsk(){modal(`<h3>確定要清空？</h3><p>所有任務、金幣、徽章都會被刪除，無法復原。</p><div class="mact"><button class="btn gray" data-act="close" data-sfx="back">取消</button><button class="btn red" data-act="resetOK">清空</button></div>`)},
  resetOK(){const pin=S.pin;S=blank();S.pin=pin;pickSel=null;save();closeModal();render()},
  demoAsk(){modal(`<h3>載入示範資料？</h3><p>目前的資料會被示範資料取代。</p><div class="mact"><button class="btn gray" data-act="close" data-sfx="back">取消</button><button class="btn green" data-act="demoOK">載入</button></div>`)},
  demoOK(){const pin=S.pin,av=S.player.avatar;S=seed();S.pin=pin;if(av){S.player.avatar=av;S.player.avatarLocked=true}save();closeModal();render()},
};
function drawPin(){mbox().innerHTML=`<h3 style="text-align:center">🔒 家長密碼</h3><div class="pin">${[0,1,2,3].map(i=>`<i>${pinBuf[i]?'●':''}</i>`).join('')}</div>
  <div class="pad">${['1','2','3','4','5','6','7','8','9','c','0','x'].map(k=>k==='x'?`<button class="btn gray" data-act="close" data-sfx="back">取消</button>`:k==='c'?`<button class="btn white" data-act="pk" data-k="c">清除</button>`:`<button class="btn white" data-act="pk" data-k="${k}" data-sfx="none">${k}</button>`).join('')}</div>
  <div class="sub" style="text-align:center;margin-top:8px">預設密碼 0000</div>`}

/* global click: every button makes a sound */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-act]');if(!el)return;
  audioInit();
  const s=el.dataset.sfx;
  if(s!=='none')SFX.play(s||'click');
  else if(el.dataset.act==='pk')SFX.play('beep');
  const a=el.dataset.act;if(a&&A[a])A[a](el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nfT')NF.title=t.value;
  if(t.dataset.vol){S.settings[t.dataset.vol]=t.value/100;applyVol();save()}
});
document.addEventListener('change',e=>{if(e.target.dataset.vol==='sfx')SFX.play('click')});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nfT'){e.preventDefault();A.nfOK()}});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='set')render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
$('#startHero').innerHTML=`<div class="bob">${hero(lvOf(S.player.xp))}</div>`;
render();
})();
</script>
</body>
</html>
